<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Data Ingestion Framework</title>
  <desc id="d">Pipeline from sources through a hash check into an immutable raw table and read-only views, with an ops layer watching every stage.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#9fb3c4"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d2d3d" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#16222e"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- title block -->
  <text x="60" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#eaf0f5">Data Ingestion Framework</text>
  <text x="60" y="166" font-family="'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#9fb3c4">Raw, traceable, observable ingestion.</text>

  <!-- connectors between stages -->
  <g stroke="#9fb3c4" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="284" y1="350" x2="342" y2="350"/>
    <line x1="570" y1="350" x2="628" y2="350"/>
    <line x1="856" y1="350" x2="914" y2="350"/>
  </g>

  <!-- stage: sources -->
  <rect x="60" y="285" width="220" height="130" rx="10" fill="#1d2c3b" stroke="#38506a" stroke-width="2"/>
  <text x="84" y="335" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#eaf0f5">Sources</text>
  <text x="84" y="366" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#9fb3c4">FRED today</text>
  <text x="84" y="390" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#9fb3c4">more to come</text>

  <!-- stage: hash check -->
  <rect x="346" y="285" width="224" height="130" rx="10" fill="#1d2c3b" stroke="#38506a" stroke-width="2"/>
  <text x="370" y="335" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#eaf0f5">Hash check</text>
  <text x="370" y="366" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#9fb3c4">content hash on arrival</text>
  <text x="370" y="390" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#9fb3c4">new or already seen</text>

  <!-- stage: raw (the emphasised one) -->
  <rect x="632" y="265" width="224" height="170" rx="10" fill="#243546" stroke="#e3b04b" stroke-width="4"/>
  <text x="656" y="325" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#e3b04b">Raw</text>
  <text x="656" y="362" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#eaf0f5">never overwritten</text>
  <text x="656" y="388" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#eaf0f5">every row traceable</text>
  <text x="656" y="414" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#eaf0f5">single partitioned table</text>

  <!-- stage: views -->
  <rect x="918" y="285" width="222" height="130" rx="10" fill="#1d2c3b" stroke="#38506a" stroke-width="2"/>
  <text x="942" y="335" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#eaf0f5">Views</text>
  <text x="942" y="366" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#9fb3c4">read-only role</text>
  <text x="942" y="390" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#9fb3c4">for downstream use</text>

  <!-- links from each stage down to ops -->
  <g stroke="#38506a" stroke-width="2" stroke-dasharray="5 6" fill="none">
    <line x1="170" y1="415" x2="170" y2="488"/>
    <line x1="1029" y1="415" x2="1029" y2="488"/>
    <line x1="744" y1="435" x2="744" y2="488"/>
  </g>
  <!-- failure path from hash check -->
  <line x1="458" y1="415" x2="458" y2="488" stroke="#ef6f6c" stroke-width="2.5" stroke-dasharray="5 6"/>
  <text x="472" y="456" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#ef6f6c">failures are surfaced</text>

  <!-- ops bar -->
  <rect x="60" y="488" width="1080" height="64" rx="10" fill="#1d2c3b" stroke="#38506a" stroke-width="2"/>
  <text x="84" y="527" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#eaf0f5">Ops</text>
  <text x="158" y="527" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#9fb3c4">run metadata, a failure sensor and a Grafana pipeline health dashboard watch every stage</text>
</svg>
